# Bootstrap ONLY. Does not refer to certificates which do not exist yet.
# Install as /etc/nginx/sites-available/trippilot; enable only after nginx -t.
# Replace through the reviewed TLS installation step, never enable both templates together.
server {
    listen 80;
    listen [::]:80;
    server_name trip.zijinglab.com;
    server_tokens off;

    # Nginx error entries can include request URIs even without an access log.
    # Keep this site's logs disabled, rather than recording sensitive query strings.
    # This sacrifices per-request diagnostics; use bounded application journal events.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 21m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 90s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/trippilot-acme;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET { deny all; }
    }

    # No login/application over HTTP while Secure cookies cannot work correctly.
    location / {
        default_type text/plain;
        return 503 "HTTPS is not configured yet.\n";
    }
}
