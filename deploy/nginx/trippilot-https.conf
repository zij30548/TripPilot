# Activate ONLY after these exact certificate files exist and nginx -t succeeds.
# Replaces the HTTP bootstrap site; do not enable both templates simultaneously.
server {
    listen 80;
    listen [::]:80;
    server_name trip.zijinglab.com;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 21m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 90s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/trippilot-acme;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET { deny all; }
    }

    location / {
        return 308 https://trip.zijinglab.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name trip.zijinglab.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/trip.zijinglab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trip.zijinglab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TripPilotTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log off;
    error_log /dev/null crit;
    client_max_body_size 21m;
    client_header_timeout 15s;
    # These are inactivity limits, not replacements for application's total deadlines.
    client_body_timeout 30s;
    send_timeout 90s;

    location / {
        # Fixed loopback target; no variable upstream, arbitrary URL or direct API port.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host trip.zijinglab.com;
        proxy_set_header X-Forwarded-Host trip.zijinglab.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_ignore_client_abort off;
        proxy_max_temp_file_size 0;
        proxy_next_upstream off;
        proxy_redirect off;
        proxy_intercept_errors off;
        proxy_cache off;
        proxy_store off;
    }
}
