[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pillow==12.3.0",
    "pydantic-settings>=2.15.0",
    "pymysql[rsa]==1.2.3",
    "sqlmodel>=0.0.42",
]

# Full reference core is an offline candidate, not imported by the application.
# Keep its service dependencies opt-in; no Redis/Chroma server starts at install.
[project.optional-dependencies]
# Only the standard MCP client and schema validation for opt-in POI search.
# Does not install or start Redis/Chroma or enable another model path.
amap-mcp = [
    "jsonschema==4.26.0",
    "mcp==1.26.0",
]
echomind = [
    "chromadb==0.5.23",
    "jsonschema==4.26.0",
    "mcp==1.26.0",
    "prometheus-client==0.21.1",
    "redis==5.2.1",
]

[dependency-groups]
echomind-test = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=0.25,<2",
    "fakeredis[lua]>=2.26,<3",
]
